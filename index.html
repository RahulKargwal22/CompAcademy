<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commissions Academy</title>
<style>
:root{--blue:#0176d3;--dk:#032d60;--sky:#eaf5fe;--g1:#f3f3f3;--g2:#dddbda;--mu:#5c5c5c;--ok:#2e844a;--okbg:#ebf7e6;--bad:#ba0517;--badbg:#feded8;--warn:#a96404;--warnbg:#fff3d6;--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#181818;background:#f4f8fc;line-height:1.5}
header{background:linear-gradient(120deg,var(--dk),var(--blue));color:#fff;padding:14px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:20px;cursor:pointer}header input{flex:1;min-width:200px;max-width:460px;padding:10px 14px;border-radius:20px;border:0}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:20px;padding:8px 14px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
.hero{background:#fff;border-radius:var(--r);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(3,45,96,.1)}
.hero h1{margin:0 0 6px;font-size:34px;color:var(--dk)}.hero p{margin:0;color:var(--mu);max-width:620px}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--g2) 0);display:grid;place-items:center}.ring div{width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--dk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:20px}
.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:.2s;cursor:pointer;border:1px solid transparent}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(1,118,211,.2);border-color:var(--blue)}.card.dis{opacity:.55;cursor:default}
.card .ic{font-size:34px}.card h3{margin:8px 0 4px;color:var(--dk)}.card p{margin:0 0 10px;color:var(--mu);font-size:14px}.meta{font-size:12px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bar{height:8px;background:var(--g2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .5s}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}.t-ok{background:var(--okbg);color:var(--ok)}.t-il{background:var(--sky);color:var(--blue)}.t-pv{background:var(--warnbg);color:var(--warn)}.t-done{background:var(--ok);color:#fff}
.crumb{font-size:13px;color:var(--mu);margin-bottom:12px}.crumb a{color:var(--blue);cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--g2);background:#fff;border-radius:20px;padding:8px 14px;cursor:pointer}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.layout{display:grid;grid-template-columns:270px 1fr;gap:20px}@media(max-width:820px){.layout{grid-template-columns:1fr}.hero h1{font-size:26px}}
.side{background:#fff;border-radius:var(--r);padding:12px;height:fit-content;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.m{padding:10px;border-radius:10px;cursor:pointer;display:flex;gap:8px;font-size:14px}.m:hover,.m.on{background:var(--sky)}.m.on{color:var(--blue);font-weight:700}
.panel{background:#fff;border-radius:var(--r);padding:24px;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:18px}.panel h2{margin-top:0;color:var(--dk)}.panel h3{color:var(--blue);margin-bottom:6px}
.acc{border:1px solid var(--g2);border-radius:12px;margin:10px 0;overflow:hidden}.acc>.hd{padding:12px 16px;cursor:pointer;font-weight:600;background:var(--g1)}.acc>.bd{padding:14px 16px;display:none}.acc.open>.bd{display:block}.acc.open>.hd{background:var(--sky);color:var(--blue)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}th,td{border:1px solid var(--g2);padding:8px 10px;text-align:left}th{background:var(--sky);color:var(--dk)}
.call{border-left:5px solid var(--blue);background:var(--sky);padding:12px 16px;border-radius:8px;margin:12px 0}.call.w{border-color:var(--warn);background:var(--warnbg)}.call.g{border-color:var(--ok);background:var(--okbg)}
.flow{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.flow div{background:var(--sky);border:1px solid var(--blue);border-radius:10px;padding:10px 12px;font-size:13px;flex:1;min-width:140px}.flow b{display:block;color:var(--blue)}
.q{border:2px solid var(--g2);border-radius:12px;padding:16px;margin:14px 0}.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--bad)}.ty{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase}
.opt{padding:10px 12px;border:1px solid var(--g2);border-radius:10px;margin:6px 0;cursor:pointer}.opt:hover{background:var(--sky)}.opt.sel{border-color:var(--blue);background:var(--sky)}.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:10px;padding:12px;border-radius:8px;font-size:14px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
button.p{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}button.s{background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:8px;padding:10px 18px;cursor:pointer}
input.n,select.n{padding:9px;border:1px solid var(--g2);border-radius:8px;width:100%}label{font-size:13px;color:var(--mu);display:block;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.res{background:var(--dk);color:#fff;border-radius:12px;padding:16px;margin-top:12px}.res table td,.res table th{color:#fff;background:none;border-color:#456}
.nav{display:flex;justify-content:space-between;margin-top:18px}.bm{cursor:pointer;float:right;font-size:22px}.src{font-size:12px;color:var(--mu)}

.wow{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:44px 40px 40px;min-height:330px;background:linear-gradient(135deg,#032d60 0%,#0176d3 55%,#1b96ff 100%);box-shadow:0 10px 30px rgba(3,45,96,.3)}
.wow h1{margin:0 0 10px;font-size:42px;line-height:1.1;max-width:560px}.wow p{max-width:540px;font-size:16px;color:#dcefff;margin:0 0 20px}
.wow .cta{display:flex;gap:10px;flex-wrap:wrap}.wow .cta button{border:0;border-radius:24px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
.cta .go1{background:#fff;color:var(--dk)}.cta .go2{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)!important}
.cta button:hover{transform:translateY(-2px)}
.cl{position:absolute;background:rgba(255,255,255,.14);border-radius:50px;height:34px;animation:drift 26s linear infinite}
.cl:before,.cl:after{content:"";position:absolute;background:inherit;border-radius:50%}.cl:before{width:44%;height:130%;left:14%;top:-60%}.cl:after{width:34%;height:100%;left:50%;top:-40%}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
.st{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;animation:tw 2.6s infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.stage{position:absolute;right:30px;top:20px;width:340px;height:290px}
.mas{position:absolute;cursor:pointer}.m1{right:60px;top:60px;width:210px;animation:flt 3.6s ease-in-out infinite}.m2{right:0;top:10px;width:70px;animation:flt 2.8s ease-in-out infinite .5s}.m3{right:250px;top:170px;width:78px;animation:flt 3.2s ease-in-out infinite 1s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.arm{transform-origin:178px 122px;animation:wv 1.3s ease-in-out infinite}@keyframes wv{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
.bub{position:absolute;right:215px;top:6px;background:#fff;color:var(--dk);padding:10px 14px;border-radius:16px;font-size:13px;font-weight:600;max-width:210px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.bub:after{content:"";position:absolute;right:-8px;top:18px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:-26px 18px 0;position:relative}
.kpi{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 4px 14px rgba(3,45,96,.15)}.kpi b{display:block;font-size:28px;color:var(--blue)}.kpi span{font-size:12px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:12px}
.tile{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:1px solid var(--g2);transition:.2s}.tile:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 8px 18px rgba(1,118,211,.18)}.tile .ic{font-size:26px}.tile b{display:block;color:var(--dk);margin-top:4px}.tile span{font-size:13px;color:var(--mu)}
.news{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.news div{flex:1;min-width:240px;background:#fff;border-left:5px solid var(--blue);border-radius:10px;padding:12px 14px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.next{background:#fff;border-radius:16px;padding:16px 20px;margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(3,45,96,.12);border:2px dashed var(--blue)}
.pill{display:inline-block;background:var(--sky);color:var(--blue);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.sh{color:var(--dk);margin:28px 0 4px;font-size:22px}
@media(max-width:820px){.stage{display:none}.wow h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><div class="logo" onclick="go('home')">☁ Commissions Academy</div><input id="srch" placeholder="Search components, topics, glossary, FAQs…" oninput="doSearch(this.value)"><button onclick="go('home')">Home</button><button onclick="resetAll()">Reset progress</button></header>
<main id="app"></main>
<script>
/* CONTENT (kept separate from UI engine). Add components by pushing to COMPONENTS. */
const SRC={g4gfaq:"https://salesforce.enterprise.slack.com/docs/T01G0063H29/F07HFBS634Y",g4ghq:"https://salesforce.enterprise.slack.com/docs/T01G0063H29/F0AR09EBQNM",mib:"https://docs.google.com/presentation/d/1hjojKiIzu1Hw7XTBj_RxA3I4mYHs89-sZwk1EtLFyaY/edit",eoy:"https://salesforce.enterprise.slack.com/files/U02EZ500NCT/F0BVCE3CV6K/fy27_g4g_incentive_comp__end_of_year_treatment__enablement_wip_",spmib:"https://salesforce.enterprise.slack.com/files/U02EZ500NCT/F0A7TBXBLBH/_wip__fy27_g4g_meeting_in_a_box__specialist_ae",adv:"https://salesforce.enterprise.slack.com/docs/T01G0063H29/F0ASAP9T3EX",faq:"https://salesforce.enterprise.slack.com/docs/T01G0063H29/F084M2SAFHB",lrn:"https://salesforce.enterprise.slack.com/files/U02EZ500NCT/F0CEL2XHMA9/copy_of_fy28_g4g_nnaov_learning_series__comp___quota__wip_",proxy:"https://salesforce.enterprise.slack.com/docs/T01G0063H29/F0B706U6K37",hub:"https://salesforce.enterprise.slack.com/docs/T01G0063H29/F0ABVQVPUA3",ph3:"https://salesforce.enterprise.slack.com/archives/C0C4JL1A5L0/p1791289168651059?thread_ts=1791289168.651059",loa:"https://salesforce.enterprise.slack.com/archives/C0B1AU4LGRZ/p1793635506371589?thread_ts=1793635506.371589"};
const L=(k,t)=>`<a href="${SRC[k]}" target="_blank">${t||'source'}</a>`;
const OK='<span class="tag t-ok">Confirmed</span>',IL='<span class="tag t-il">Illustrative</span>',PV='<span class="tag t-pv">Pending Validation</span>';
const NNAOV={id:"nnaov",icon:"📈",name:"NNAOV – Net New Annual Order Value",short:"The single company-wide metric combining growth (ACV) and revenue retention (Attrition).",time:"~75 min",
modules:[
{id:"m1",title:"Introduction & Business Purpose",icon:"🎯",html:`
<p>${OK} <b>Net New Annual Order Value (NNAOV)</b> combines focus on <b>growth and revenue retention</b> into one metric, giving a broader "true" view of each customer. ${L('faq','FY26 FAQ')} · ${L('hub','FY27 Resource Hub')}</p>
<div class="call g"><b>Core formula:</b> NNAOV = ACV − Attrition (equivalently Ending AOV − Beginning AOV)</div>
<div class="acc open"><div class="hd">Why does it exist?</div><div class="bd"><ul><li><b>Sustainable growth</b> – preventing attrition is essential as the install base grows.</li><li><b>Customer success</b> – supports consumption-based selling such as Agentforce.</li><li><b>Aligned goals</b> – Sales, Success and Renewals share one target.</li><li>ACV only tracks bookings; NNAOV also reflects attrition.</li></ul></div></div>
<div class="acc"><div class="hd">Who is impacted?</div><div class="bd">Core/Prime AEs and Managers, Specialists, Renewal Managers, CSMs, CSG, Sales Ops, Deal Desk, GIC Commissions. See module 4.</div></div>
<div class="acc"><div class="hd">FY27 / FY28 context</div><div class="bd"><ul><li>${OK} FY27: NNAOV is a company-wide metric across Sales, Success, Renewals, Pro Services and Global Partnerships (${L('hub')}).</li><li>${PV} FY28 plan/quota changes exist only in a <b>WIP draft deck</b> (${L('lrn','draft')}).</li></ul></div></div>`,
q:[{t:"mc",q:"Which statement best describes NNAOV?",o:["Only new bookings (ACV)","ACV minus Attrition – net growth across the customer base","Total renewals booked","Only attrition prevented"],a:1,why:"NNAOV = ACV − Attrition. ACV alone tracks bookings only.",ref:"m1"},
{t:"tf",q:"True or False: Saving a dollar of attrition is valued like selling a dollar of new ACV.",a:true,why:"Enablement material states a dollar of attrition saved is just as valuable as a dollar of new ACV.",ref:"m1"},
{t:"ms",q:"Select ALL reasons NNAOV was introduced.",o:["Sustainable growth","Align Sales, Success and Renewals","Replace forecasting","Support consumption-based selling"],a:[0,1,3],why:"AEs still forecast ACV and CSG forecasts attrition, so forecasting isn't replaced.",ref:"m1"}]},
{id:"m2",title:"End-to-End Process",icon:"🔄",html:`
<p>${OK} NNAOV is measured at the <b>Order level</b>; for renewal deals, paired opportunities are the lens for gathering data (${L('adv','NNAOV Advisor')}).</p>
<div class="flow"><div><b>1 Trigger</b>Growth or attrition event</div><div><b>2 Classify</b>Order type, Booking Treatment, term, co-term, ISV</div><div><b>3 Annualize</b>STC / STNCO / ramp / stub rules</div><div><b>4 Timing</b>15-Day Rule sets commission month</div><div><b>5 Calculate</b>ACV − Attrition at Country Company level</div><div><b>6 Pay</b>Credits to ICM tool (Spiff) → statements</div></div>
<div class="call">${OK} Targets <b>and</b> credits are at <b>Country Company</b> level; for global companies activity applies where the event occurs.</div>
<div class="acc open"><div class="hd">Renewal-family deals: paired-opportunity rule</div><div class="bd"><table><tr><th>Opportunity</th><th>Owner</th><th>Carries</th></tr><tr><td>Renewal / Attrition opp</td><td>Renewal Manager</td><td>Prior ACV / forecasted Attrition</td></tr><tr><td>New Business / Add-on opp</td><td>AE</td><td>iACV = incremental delta</td></tr></table>Add-on Amount = New Total ACV − Prior ACV. Using one opp alone <b>understates NNAOV</b>. If the pair can't be found, stop and ask.</div></div>
<div class="acc"><div class="hd">Payment cadence</div><div class="bd"><ul><li>${OK} ACV paid monthly; Attrition paid quarterly with a <b>35% monthly draw</b> (months 1–2), true-up month 3 (${L('adv')}).</li><li>${OK} Draft deck: "35% Monthly NNAOV TI Draw, trued-up quarterly on actuals" (${L('lrn')}).</li><li>${PV} Per-role payment timing is described differently across sources.</li></ul></div></div>`,
q:[{t:"mc",q:"For a renewal with upsell, which records must be combined?",o:["Two Renewal opps","RM-owned Renewal/Attrition opp + AE-owned Add-on opp","Only the Add-on opp","Account and Contact"],a:1,why:"Renewal opp carries Prior ACV/Attrition; Add-on carries iACV.",ref:"m2"},
{t:"num",q:"Prior ACV = 420, new total ACV = 500 ($K). What should the Add-on opp Amount (iACV) be, in $K?",a:80,why:"500 − 420 = 80. An Amount of 500 would be a blocking anomaly.",ref:"m2"},
{t:"mc",q:"At what level are NNAOV targets and credits measured?",o:["Opportunity","Contact","Country Company","Global only"],a:2,why:"Both targets and credits are at Country Company level.",ref:"m2"}]},
{id:"m3",title:"Calculations & Business Logic",icon:"🧮",html:`
<h3>A. Base calculation ${OK}</h3><div class="call g">NNAOV = Ending AOV − Beginning AOV = ACV − Attrition</div>
<p><b>Worked example ${IL}</b> (FY26 FAQ): Beginning AOV $100M; Expansion +$18M; New Logo +$1M; Attrition −$8M → Ending AOV $111M → <b>NNAOV = $11M</b>. ${L('faq')}</p>
<h3>B. Annualization ${OK}</h3><table><tr><th>Order type</th><th>Treatment</th></tr>
<tr><td>STC</td><td>Annualized only if standalone ≥12 months AND last order co-terms with master agreement; else OTV</td></tr>
<tr><td>STNCO</td><td>Never annualized; <b>50% of OTV</b></td></tr>
<tr><td>Utilization (BT 02), 12 mo</td><td>Normalize to annual rate</td></tr>
<tr><td>Multi-year ramp</td><td>Y1 = Y1 ACV − Prior ACV; Year N = Year N ACV − Year N-1 ACV</td></tr>
<tr><td>Stub-term ramp</td><td>Annualized only if series &gt;12 mo AND last order co-terms</td></tr>
<tr><td>30-day flat extension</td><td>Non-commissionable</td></tr>
<tr><td>Swap, flat AOV</td><td>No NNAOV impact</td></tr></table>
<h3>C. 15-Day Rule ${OK}</h3><p>Applies to Growth and Attrition. OSD on/before the 15th → credit in the <b>prior</b> month; after the 15th → OSD month (Sep 15 → Aug; Sep 16 → Sep).</p>
<div class="call w"><b>FY28 sunset:</b> discontinued effective Feb 1, 2027. ${PV} A Phase 3 thread discusses a "15-Day → 1-Day" change; confirm final rule (${L('ph3','thread')}).</div>
<h3>D. Quarterly cap ${OK}</h3><table><tr><th>Attrition ÷ NNAOV quota</th><th>Cap (of quarterly NNAOV quota)</th></tr><tr><td>&lt;20%</td><td>300%</td></tr><tr><td>≥20% to &lt;40%</td><td>200%</td></tr><tr><td>≥40% to &lt;60%</td><td>150%</td></tr><tr><td>≥60%</td><td>100%</td></tr></table>
<p>${PV} Advisor says the cap applies "months 13–60"; the FY28 draft says "100–300% … until Q4". Validate with Plan Ops.</p>
<h3>E. Commission payment ${OK}</h3><div class="call">Attainment × Multiplier (per tier) × Prorated TI. ${PV} Tier multiplier values were not in the sources; the calculator asks you to enter them.</div>
<h3>F. Protections ${OK}</h3><ul><li><b>Significant Attrition Event:</b> single event ≥100% of Attrition Quota → excess above 100% at 25%.</li><li><b>CTO windfall:</b> CTO credit ≥50% of annual full NNAOV quota → excess at 25%.</li><li><b>CSG Services Big Deal:</b> AE capped at 200% of NNAOV quota; excess at 25%.</li><li><b>Inheritance:</b> attrition within 30 days of takeover (up to 60 in special cases) → Comp Case.</li><li><b>ISV:</b> credited at PNR (15–25%). FY27 exclusions: Veeva, primary IQVIA partner; Informatica for ICs/Managers only.</li></ul>
<h3>G. NRR</h3><p>${OK} FY26 FAQ: NRR does not apply to NNAOV on-dash or for comp. ${PV} The Advisor says NRR applies to the ACV side (±90 days); confirm for FY27.</p>`,
q:[{t:"num",q:"Beginning AOV $100M, Expansion +$18M, New Logo +$1M, Attrition −$8M. NNAOV in $M?",a:11,why:"Ending = 100+18+1−8 = 111; NNAOV = 111 − 100 = 11.",ref:"m3"},
{t:"num",q:"STNCO order with OTV $80K. Comp credit in $K?",a:40,why:"STNCO is credited at 50% of OTV: 0.5 × 80 = 40.",ref:"m3"},
{t:"mc",q:"OSD is September 15. Which month gets the credit?",o:["September","August","October","Depends on booking date"],a:1,why:"On/before the 15th pulls credit into the prior month; it depends on OSD only.",ref:"m3"},
{t:"num",q:"Attrition quota $30M, NNAOV quota $100M, quarterly NNAOV quota $500K. Quarterly cap in $K?",a:1000,why:"Ratio 30% → 200% tier → 2 × 500 = 1,000.",ref:"m3"},
{t:"num",q:"Ramp: Prior 250, Y1 300, Y2 380 ($K). Year 2 NNAOV?",a:80,why:"Y2 − Y1 = 380 − 300 = 80.",ref:"m3"},
{t:"tf",q:"True or False: a 30-day flat extension generates ACV credit.",a:false,why:"Flat extensions are non-commissionable.",ref:"m3"},
{t:"ms",q:"Select ALL that are Non-AOV (not in NNAOV).",o:["Professional Services","Recurring License (BT 01)","Event Passes","Heroku Online"],a:[0,2,3],why:"BT 01/02 are AOV-eligible; Pro Services, Education, Fees, Event Passes, Overages, Heroku Online and Slack Self-Service are not.",ref:"m3"}]},
{id:"m4",title:"AE Alignment & Stakeholders",icon:"👥",html:`
<div class="call w">${PV} Sources provide <b>role-level</b> alignment only. No AE names are listed; use Plan Ops reference tables / LOA Quota Mapping for named alignment.</div>
<h3>Role → metric (FY27, from FY28 draft deck)</h3><table><tr><th>Group</th><th>Measured on</th></tr>
<tr><td>Core AEs, Prime AEs, GRB AEs (team attrition), Partner Sales</td><td>ACV &amp; Attrition</td></tr>
<tr><td>Core Managers, Prime Managers, Execs (SVP/EVP)</td><td>NNAOV (single metric)</td></tr>
<tr><td>Specialist AE &amp; Mgrs, ECS, SE, BVS, Ind GTM, Consumption Seller, Renewal Mgr, AP Mgrs, PAM</td><td>Territory NNAOV</td></tr>
<tr><td>ESB Pooled AE, Hunter AE, Sales Dev, Pro Serve ICs, CSMs, Builders</td><td>Excluded (per draft)</td></tr></table>
<p>${IL} Draft weights: AE 55% ACV / 25% Attrition / 20% MY; Manager 80% NNAOV / 20% MY. ${PV} WIP draft. ${L('lrn')}</p>
<h3>Who owns what</h3><table><tr><th>Stakeholder</th><th>Responsibility</th></tr>
<tr><td>AE</td><td>Forecasts ACV; structures deals to limit attrition risk; partners with RM and CSM</td></tr>
<tr><td>Renewal Manager</td><td>Contract expert; price uplift; attrition reporting/forecast with Finance; owns Renewal/Attrition opp</td></tr>
<tr><td>CSG / Success</td><td>Forecasts attrition; monitors account health</td></tr>
<tr><td>Plan Ops / Design</td><td>Reference tables and plan design</td></tr>
<tr><td>GIC Commissions</td><td>Credit validation, Comp Cases</td></tr>
<tr><td>Sales Ops / Deal Desk</td><td>Deal-structure guidance</td></tr></table>
<div class="call">${OK} Specialists: Product ACV + Territory C360 NNAOV. Core measured on attrition across all clouds; Prime on their own cloud only.</div>
<div class="call w">${OK} Design item D-6567: NNAOV (Territory) wrongly mapped to Individual scope was removed from the Nov 2 LOA Quota Mapping table. ${L('loa','thread')}</div>`,

{id:"m5",title:"Inputs, Outputs & Dependencies",icon:"🗄️",html:`
<div class="flow"><div><b>Inputs</b>Salesforce Order/Opp/Quote, Booking Treatment, dates, quota tables, account hierarchy</div><div><b>Transform</b>NNAOV Proxy (dbt) unions ACV &amp; Attrition on one grain</div><div><b>Compute</b>Credits at Country Company</div><div><b>Outputs</b>Dashboards, Spiff credits, statements</div></div>
<ul><li>${OK} <b>NNAOV Proxy</b> rebuilds ACV and Attrition in dbt, replacing hand-maintained SSE views (${L('proxy','Technical Hub')}).</li><li>${OK} Verify in: Global NNAOV Dashboard, AE Home Dashboard (ATR, forecasted attrition), Attrition Dashboard, Global Forecast Dashboard, Contest Central, Basecamp Global NNAOV Policy, GIC Product Matrix.</li></ul>
<h3>Missing or incorrect inputs</h3><table><tr><th>Issue</th><th>Impact</th></tr><tr><td>Missing contract dates</td><td>Annualization and 15-Day Rule can't be applied (blocking)</td></tr><tr><td>ACV = $0 or negative</td><td>Likely swap/downgrade/data issue (blocking)</td></tr><tr><td>Add-on Amount = full contract value</td><td>Overstates NNAOV (blocking)</td></tr><tr><td>Attrition = ACV exactly</td><td>Likely placeholder (blocking)</td></tr><tr><td>ISV opp without PNR</td><td>Can't weight ISV (advisory)</td></tr></table>
<div class="call w">${PV} Field threads report Spiff NNAOV figures not reflecting actuals; the FY28 draft lists "data discrepancies, unexpected clawbacks, slow case resolution" as FY27 challenges. Escalate via Comp Case.</div>`,
q:[{t:"mc",q:"What does the NNAOV Proxy pipeline do?",o:["Pays commissions","Rebuilds ACV and Attrition in dbt on one comparable grain","Replaces Opportunities","Forecasts quotas"],a:1,why:"It replaces hand-maintained SSE views with version-controlled dbt models.",ref:"m5"},
{t:"ms",q:"Which are BLOCKING anomalies?",o:["Missing contract start/end date","Add-on amount looks like full contract value","Close date in the past","ACV = $0 or negative"],a:[0,1,3],why:"A past close date is only advisory.",ref:"m5"}]},
{id:"m6",title:"Exceptions & Business Rules",icon:"⚠️",html:`
<div class="acc open"><div class="hd">Common exceptions ${OK}</div><div class="bd"><ul><li><b>Early renewals:</b> equal or higher annual spend, no reduction to remaining TCV.</li><li><b>Cross-OU transfers:</b> zero-growth events; license transfers/consolidations: no impact if global AOV unchanged.</li><li><b>Splits &amp; LOA:</b> ACV splits normal; local AE takes 100% of attrition.</li><li><b>Cross-fiscal FDOs:</b> primary current AE gets 100%.</li><li><b>Software → services swap:</b> attrition event.</li><li><b>CTOs ≥12 months:</b> ENTR/GB AEs only.</li><li><b>Club FY27:</b> ≥100% of ACV OR NNAOV quota; verify on Contest Central.</li></ul></div></div>
<div class="acc"><div class="hd">Pending: EOL/EOS products</div><div class="bd">${PV} Two statements exist: no relief (default) vs relief if large AOV and no replacement. Recommend a Comp Case.</div></div>
<div class="acc"><div class="hd">Common analyst mistakes</div><div class="bd"><ul><li>Calculating from a single opp on a renewal deal.</li><li>Annualizing an STNCO.</li><li>Using booking date instead of OSD for the 15-Day Rule.</li><li>Applying the Informatica exclusion without org level.</li><li>Treating draft FY28 info as final.</li></ul></div></div>
<div class="acc"><div class="hd">Troubleshooting</div><div class="bd"><table><tr><th>Symptom</th><th>Check</th></tr><tr><td>NNAOV too high</td><td>Add-on delta vs full value; missing RM attrition</td></tr><tr><td>Credit in wrong month</td><td>OSD vs 15th; NRR OSD independently</td></tr><tr><td>Negative balance</td><td>Attrition before growth can create negatives; check draws and actuals; Comp Case</td></tr><tr><td>Informatica attrition shows</td><td>Confirm requester org level</td></tr></table></div></div>`,
q:[{t:"sc",q:"An early renewal reduces remaining TCV. What do you do?",o:["Calculate normally","Flag as blocking and recommend policy review","Treat as STNCO","Apply 50% haircut"],a:1,why:"It violates early-renewal eligibility.",ref:"m6"},
{t:"sc",q:"Informatica deal; you don't know the rep's org level. Next step?",o:["Exclude it","Include it","Ask for their org level","Skip the deal"],a:2,why:"Exclusion is for ICs/Managers only; OU/OU+1 leaders keep it.",ref:"m6"},
{t:"tf",q:"True or False: Mid-Market AEs are NNAOV-eligible for CTOs ≥12 months.",a:false,why:"ENTR/GB AEs only.",ref:"m6"}]},
{id:"m7",title:"Real-World Examples",icon:"💼",html:`
<h3>1 – Renewal with upsell ${IL}</h3><p>Prior ACV $420K → renews at $500K. iACV on Add-on = $80K. NNAOV = <b>+$80K</b>.</p>
<h3>2 – Partial churn ${IL}</h3><p>Prior $200K → renews $150K. Attrition $50K → NNAOV <b>−$50K</b>.</p>
<h3>3 – Ramp ${IL}</h3><table><tr><th>Year</th><th>ACV</th><th>NNAOV</th></tr><tr><td>Prior</td><td>250</td><td>–</td></tr><tr><td>Y1</td><td>300</td><td>50</td></tr><tr><td>Y2</td><td>380</td><td>80</td></tr><tr><td>Y3</td><td>450</td><td>70</td></tr></table>
<h3>4 – STNCO ${IL}</h3><p>6-month non-coterminous, OTV $60K → credit $30K.</p><p class="src">Illustrative numbers only – not real AE data.</p>`,

modules:[
{id:"g1",title:"What is G4G?",icon:"🎯",html:`
<p>${OK} <b>Go for Growth (G4G)</b> is the annual planning process to get Distribution teams ready for the new fiscal year and Fast Start. ${L('g4gfaq','FY28 G4G FAQs')}</p>
<div class="call g"><b>The promise:</b> every commissionable employee should start the year with a role and manager, accounts to sell to, a quota and compensation plan in hand, a distribution kick-off with account plan or transition, and dashboards and tools for visibility. ${L('g4ghq','G4G HQ')}</div>
<div class="acc open"><div class="hd">What does G4G include?</div><div class="bd"><ul><li>Setting budgets and updating account data</li><li>Planning territories and org structures</li><li>Assigning new territories</li><li>Distributing compensation plans and quotas</li></ul></div></div>
<div class="acc"><div class="hd">How big is it?</div><div class="bd">${OK} The GTM Planning and Execution team orchestrates G4G across 17+ workstreams (including Territory Planning, Quota and Capacity, Global Incentive Comp, Global Sales Policy) and 400+ program milestones.</div></div>
<div class="acc"><div class="hd">Where does Commissions fit?</div><div class="bd">Quota and compensation plans are what reps need in hand to start. GIC Commissions supports the questions that follow. ${IL} This line is a learning summary, not a quote.</div></div>`,
q:[{t:"mc",q:"What is Go for Growth (G4G)?",o:["A sales contest with prizes","The annual planning process that gets distribution teams ready for the new fiscal year and Fast Start","A quarterly commission statement","A Trailhead badge"],a:1,why:"G4G is the annual planning process covering territories, org, quotas and comp plans.",ref:"g1"},
{t:"ms",q:"Select ALL that every commissionable employee should start the year with.",o:["A role and a manager","Accounts they can sell to","Quota and compensation plan in hand","Distribution kick-off and account plan or transition","A guaranteed bonus","Dashboards and tools for visibility"],a:[0,1,2,3,5],why:"There is no guaranteed bonus in the G4G promise.",ref:"g1"},
{t:"tf",q:"True or False: G4G covers only compensation plans.",a:false,why:"It also covers budgets, account data, territories, org structures and quotas.",ref:"g1"}]},
{id:"g2",title:"Meeting in a Box & Resources",icon:"🧰",html:`
<p>${OK} A <b>Meeting in a Box (MIB)</b> is a pre-packaged toolkit that helps managers communicate key FY27 GTM changes and role updates. Managers make their own copy. ${L('mib','MIB landing page')}</p>
<table><tr><th>Role MIB</th><th>Covers</th></tr><tr><td>Core AE</td><td>Expanded portfolio, NNAOV and Consumption/NCR, SMB and MM segment line changes</td></tr><tr><td>Specialist AE</td><td>New focus as product experts, NNAOV, NCR and compensation</td></tr><tr><td>Agentforce/Data360 SE</td><td>Role scope, Consumption/NCR, NNAOV, compensation</td></tr><tr><td>Consumption Seller</td><td>Consumption/NCR, team alignment and processes</td></tr><tr><td>CSM</td><td>NNAOV, Consumption/NCR, team alignment</td></tr></table>
<div class="call w"><b>Acknowledge → Frame → Route.</b> The Specialist MIB states it does <b>not</b> resolve individual compensation scenarios (for example attrition timing or inherited accounts). Managers acknowledge the question, frame the general rule, and route it. ${PV} Draft deck. ${L('spmib','Specialist AE MIB')}</div>
<div class="acc open"><div class="hd">Where do reps go for help?</div><div class="bd"><ul><li>FY28 G4G FAQs for process questions ${L('g4gfaq')}</li><li>A support workflow linked at the top of the FAQ</li><li>Compensation (GIC) Website and Product Eligibility Matrix for comp and product questions (named in the MIB speaker notes)</li></ul></div></div>`,
q:[{t:"mc",q:"What is a Meeting in a Box?",o:["A pre-packaged toolkit to help managers communicate FY27 GTM changes and role updates","A payroll file","A quota calculator","A Trailhead course for admins"],a:0,why:"MIBs are manager toolkits, one per role.",ref:"g2"},
{t:"tf",q:"True or False: a MIB resolves individual compensation scenarios.",a:false,why:"It does not. Route individual scenarios.",ref:"g2"},
{t:"sc",q:"In a team session an AE asks how attrition timing affects their own payout. What is the best response?",o:["Calculate it live from memory","Acknowledge the question, frame the general rule, and route the individual case","Say it is not relevant","Promise a specific amount"],a:1,why:"Acknowledge, frame, route.",ref:"g2"}]},
{id:"g3",title:"Quota vs Reported ACV",icon:"⚖️",html:`
<p>${OK} From the Specialist AE MIB: <b>your personal compensation quota is not the company's reported ACV.</b> ${L('spmib')}</p>
<table><tr><th>Idea</th><th>Meaning</th></tr><tr><td>Two sets of books</td><td>The number you are paid on is not always the number the business reports.</td></tr><tr><td>Off-dash products</td><td>Some products you earn commission on are intentionally excluded from your forecasting and standard dashboards.</td></tr><tr><td>Comp does not equal ACV credit</td><td>Incentives like SPIFFs may increase payout, but they do not increase the ACV the business reports.</td></tr></table>
<div class="call">${OK} Example from the deck: a tool sums the Agentforce ACV fields on opportunity line items into the Specialist AE Amount field, based on on-dash bookings ACV.</div>
<div class="call w">${PV} Draft deck. Confirm with Plan Ops before using these points with a rep.</div>`,

{t:"mc",q:"A SPIFF raises a rep's payout. What does it do to reported ACV?",o:["Increases it","Does not increase it","Doubles it","Replaces it"],a:1,why:"Comp does not equal ACV credit.",ref:"g3"},
{t:"mc",q:"What are off-dash products?",o:["Products you earn commission on that are excluded from your forecasting and standard dashboards","Discontinued products","Products with no quota","Products sold only in one country"],a:0,why:"They are commissionable but intentionally off the standard dashboards.",ref:"g3"}]},
{id:"g4",title:"FY27 End-of-Year (EOY) Comp Treatment",icon:"📅",html:`
<div class="call w">${PV} The source is a WIP enablement deck. Confirm final rules before quoting. ${L('eoy','EOY deck')}</div>
<p>${OK} EOY treatment applies from <b>Oct 16, 2026</b> for ICs (and <b>Dec 16, 2026</b> for managers where noted), with an end date of <b>Jan 15, 2027</b>. Use the <b>EOY Role Finder</b> and <b>EOY Calculator</b> tabs to try it.</p>
<table><tr><th>Group</th><th>Start</th><th>Treatment</th></tr>
<tr><td>AE (IC)</td><td>Oct 16, 2026</td><td>Greater of 35% of monthly TI or a flat % of ACV bookings (5% or 10% by role), capped at 300% of quarterly TI</td></tr>
<tr><td>AE Manager</td><td>Dec 16, 2026</td><td>50% of monthly TI</td></tr>
<tr><td>Account Partner</td><td>Oct 16, 2026</td><td>Greater of 35% of monthly TI or 1% of GTM Services Bookings, capped at 300% of quarterly TI</td></tr>
<tr><td>A&amp;C/GP IC</td><td>Oct 16, 2026</td><td>35% of monthly TI</td></tr><tr><td>A&amp;C/GP Mgr</td><td>Dec 16, 2026</td><td>50% of monthly TI</td></tr>
<tr><td>Services (other) and Success</td><td>Oct 16, 2026</td><td>35% of monthly TI</td></tr><tr><td>Germany (all roles)</td><td>n/a</td><td>100% of monthly TI (local law)</td></tr></table>
<div class="acc open"><div class="hd">Worked AE example ${OK}</div><div class="bd">Annual TI $120,000 → Quarterly TI $30,000 → Monthly TI $10,000. Guarantee = 35% × $10,000 = <b>$3,500</b>. Cap = 300% × $30,000 = <b>$90,000</b>.<table><tr><th>ACV</th><th>×5%</th><th>Payout</th><th>Why</th></tr><tr><td>$50K</td><td>$2.5K</td><td><b>$3.5K</b></td><td>Below the guarantee</td></tr><tr><td>$150K</td><td>$7.5K</td><td><b>$7.5K</b></td><td>Above guarantee, below cap</td></tr><tr><td>$1.9M</td><td>$95K</td><td><b>$90K</b></td><td>Capped</td></tr></table></div></div>
<div class="acc"><div class="hd">Who is excluded?</div><div class="bd">Standard plans are issued to: Key Account Director, Executives (SVP+), all Sales Dev, all SE roles, Consumption Sellers, INFA AE and M&amp;A, Customer Success OU Leader, Renewals, and several other roles (see the deck). Roles with a start date on or after <b>Jan 16, 2027</b> do not receive EOY treatment; a standard plan with quota is issued.</div></div>`,

function check(id){const q=findQ(id),old=S.q[id]||{wrong:0,tries:0};let ans,ok;
if(q.t==='num'){const el=$('in_'+id);if(!el||el.value==='')return alert('Enter a number first');ans=parseFloat(el.value);ok=Math.abs(ans-q.a)<0.001}
else if(q.t==='ms'){ans=(DR[id]||[]).slice().sort();if(!ans.length)return alert('Select at least one option');ok=JSON.stringify(ans)===JSON.stringify(q.a.slice().sort())}
else{ans=DR[id];if(ans==null)return alert('Select an answer first');ok=ans===q.a}
S.q[id]={ok:ok||old.ok,last:ok,checked:true,val:q.t==='num'?ans:null,sel:q.t==='num'?null:ans,wrong:(old.wrong||0)+(ok?0:1),tries:(old.tries||0)+1};save();render()}
function retry(id){const o=S.q[id];S.q[id]={ok:false,wrong:o.wrong,tries:o.tries};DR[id]=findQ(id).t==='ms'?[]:null;save();render()}
function finalH(c){const f=finalState(c);let h=`<div class="panel"><h2>🎓 Final Assessment</h2><p>${c.final.length} questions across all modules. Pass mark: 80%. ${f&&f.pass?'<span class="tag t-done">Passed</span>':''}</p>`;
if(f){h+=`<div class="res">Final score: <b>${f.score}/${c.final.length} (${Math.round(f.score/c.final.length*100)}%)</b> – ${f.pass?'Completion earned 🏆':'Below the pass mark – review the modules below and retry.'}</div>`;
const weak=[...new Set(c.final.filter((q,k)=>{const s=S.q[qid(c.id,'final',k)];return !(s&&s.last)}).map(q=>q.ref))];
if(weak.length)h+=`<div class="call w"><b>Revisit:</b> ${weak.map(r=>{const mi=c.modules.findIndex(m=>m.id===r);return `<a style="cursor:pointer;color:var(--blue)" onclick="go('comp',null,${mi})">${c.modules[mi].title}</a>`}).join(' · ')}</div>`;
h+=`<button class="s" onclick="retryFinal('${c.id}')">Retry full assessment</button>`}
return h+c.final.map((q,k)=>qH(q,qid(c.id,'final',k))).join('')+`<button class="p" onclick="submitFinal('${c.id}')">Submit assessment</button></div>`}
function submitFinal(cid){const c=comp(cid);const un=c.final.filter((q,k)=>!S.q[qid(cid,'final',k)]).length;if(un&&!confirm(un+' question(s) unanswered. Submit anyway?'))return;let n=0;c.final.forEach((q,k)=>{const s=S.q[qid(cid,'final',k)];if(s&&s.last)n++});S.done['final.'+cid]={score:n,pass:n/c.final.length>=0.8};save();render()}
function retryFinal(cid){const c=comp(cid);c.final.forEach((q,k)=>{const id=qid(cid,'final',k);delete S.q[id];DR[id]=q.t==='ms'?[]:null});delete S.done['final.'+cid];save();render()}
/* Calculator */
function calcView(){return `<div class="panel"><h2>🧮 NNAOV Calculator</h2><p class="src">Learning tool. Results are illustrative; always validate in Spiff and dashboards. Keep currency/units consistent.</p>
<div class="acc open"><div class="hd">1. Base NNAOV</div><div class="bd"><div class="two"><div><label>Beginning AOV</label><input class="n" id="b1" type="number" value="100"><label>Expansion ACV</label><input class="n" id="b2" type="number" value="18"></div><div><label>New Logo ACV</label><input class="n" id="b3" type="number" value="1"><label>Attrition (positive number)</label><input class="n" id="b4" type="number" value="8"></div></div><button class="p" style="margin-top:10px" onclick="c1()">Calculate</button><div id="r1"></div></div></div>
<div class="acc"><div class="hd">2. Quarterly cap</div><div class="bd"><div class="two"><div><label>Attrition quota</label><input class="n" id="c1a" type="number" value="30"><label>NNAOV quota</label><input class="n" id="c1b" type="number" value="100"></div><div><label>Quarterly NNAOV quota</label><input class="n" id="c1c" type="number" value="500"></div></div><button class="p" style="margin-top:10px" onclick="c2()">Calculate</button><div id="r2"></div></div></div>
<div class="acc"><div class="hd">3. Ramp NNAOV by year</div><div class="bd"><label>Prior ACV</label><input class="n" id="rp" type="number" value="250"><label>Ramp ACV by year (comma-separated)</label><input class="n" id="rr" value="300,380,450"><button class="p" style="margin-top:10px" onclick="c3()">Calculate</button><div id="r3"></div></div></div>
<div class="acc"><div class="hd">4. Short-term order credit</div><div class="bd"><div class="two"><div><label>Order type</label><select class="n" id="st"><option value="stnco">STNCO (50% OTV)</option><option value="stc">STC – meets annualization test</option><option value="stcn">STC – does not meet test (OTV)</option></select></div><div><label>OTV</label><input class="n" id="so" type="number" value="60"><label>Term (months)</label><input class="n" id="sm" type="number" value="6"></div></div><button class="p" style="margin-top:10px" onclick="c4()">Calculate</button><div id="r4"></div></div></div>
<div class="acc"><div class="hd">5. 15-Day Rule credit month</div><div class="bd"><label>Order Start Date</label><input class="n" id="od" type="date" value="2026-09-15"><button class="p" style="margin-top:10px" onclick="c5()">Find credit month</button><div id="r5"></div></div></div>
<div class="acc"><div class="hd">6. Commission payout ${PV}</div><div class="bd"><p class="src">Structure confirmed; multiplier values are Pending Validation – enter your plan's value.</p><div class="two"><div><label>Attainment (%)</label><input class="n" id="pa" type="number" value="100"><label>Tier multiplier</label><input class="n" id="pm" type="number" value="1" step="0.1"></div><div><label>Prorated TI</label><input class="n" id="pt" type="number" value="10000"><label>Draw % already paid</label><input class="n" id="pd" type="number" value="35"></div></div><button class="p" style="margin-top:10px" onclick="c6()">Calculate</button><div id="r6"></div></div></div></div>`}
const f2=x=>(Math.round(x*100)/100).toLocaleString();
function c1(){const b=+$('b1').value,e=+$('b2').value,n=+$('b3').value,a=+$('b4').value,acv=e+n,nn=acv-a;$('r1').innerHTML=`<div class="res">ACV = ${e} + ${n} = ${f2(acv)}<br>Ending AOV = ${b} + ${f2(acv)} − ${a} = ${f2(b+nn)}<br>NNAOV = <b>${f2(nn)}</b></div>`}
function c2(){const r=+$('c1a').value/+$('c1b').value*100,q=+$('c1c').value,cap=r<20?300:r<40?200:r<60?150:100;$('r2').innerHTML=`<div class="res">Ratio = ${f2(r)}% → tier <b>${cap}%</b><br>Cap = ${cap}% × ${q} = <b>${f2(cap*q/100)}</b></div>`}
function c3(){let p=+$('rp').value;let rows='<table><tr><th>Year</th><th>ACV</th><th>NNAOV</th></tr>';$('rr').value.split(',').map(Number).forEach((y,i)=>{rows+=`<tr><td>Y${i+1}</td><td>${y}</td><td>${f2(y-p)}</td></tr>`;p=y});$('r3').innerHTML=`<div class="res">${rows}</table></div>`}
function c4(){const t=$('st').value,o=+$('so').value;let v,m;if(t==='stnco'){v=o*.5;m='STNCO: never annualized; 50% × OTV'}else if(t==='stc'){v=o/(+$('sm').value||12)*12;m='STC meeting test: annualized (OTV ÷ months × 12)'}else{v=o;m='STC not meeting test: OTV'}$('r4').innerHTML=`<div class="res">${m}<br>Credit = <b>${f2(v)}</b></div>`}
function c5(){const d=new Date($('od').value+'T00:00:00');if(isNaN(d))return;if(d>=new Date('2027-02-01T00:00:00')){$('r5').innerHTML='<div class="res">On/after Feb 1, 2027 the 15-Day Rule is discontinued: recognized in the period initiated. Final FY28 rule is Pending Validation.</div>';return}
let m=d.getMonth(),y=d.getFullYear();if(d.getDate()<=15){m--;if(m<0){m=11;y--}}$('r5').innerHTML=`<div class="res">OSD ${d.toDateString()} → credit month <b>${new Date(y,m,1).toLocaleString('en',{month:'long',year:'numeric'})}</b> (${d.getDate()<=15?'on/before the 15th → prior month':'after the 15th → OSD month'})</div>`}
function c6(){const a=+$('pa').value/100,m=+$('pm').value,t=+$('pt').value,dr=+$('pd').value/100,p=a*m*t;$('r6').innerHTML=`<div class="res">Payout = ${f2(a*100)}% × ${m} × ${f2(t)} = <b>${f2(p)}</b><br>Less draw (${f2(dr*100)}% of TI = ${f2(dr*t)}) → balance ≈ ${f2(p-dr*t)}<br><span style="font-size:12px">Illustrative; draw basis is Pending Validation.</span></div>`}
/* Search */
function doSearch(q){q=q.trim();if(!q){if(view.p==='search')go('home');return}view={p:'search',q};render()}
const strip=h=>h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
function searchView(){const q=view.q.toLowerCase();let r=[];COMPONENTS.forEach(c=>{if(c.disabled)return;if((c.name+c.short).toLowerCase().includes(q))r.push(`<div class="card" onclick="go('comp','${c.id}',0)"><b>${c.icon} ${c.name}</b><p>${c.short}</p></div>`);c.modules.forEach((m,i)=>{const t=strip(m.html),k=t.toLowerCase().indexOf(q);if(m.title.toLowerCase().includes(q)||k>=0)r.push(`<div class="card" onclick="go('comp','${c.id}',${i})"><b>${m.icon} ${m.title}</b><p>${k>=0?'…'+t.slice(Math.max(0,k-60),k+120)+'…':''}</p></div>`)});
Object.entries(c.gloss||GLOSS).forEach(([k,v])=>{if((k+v).toLowerCase().includes(q))r.push(`<div class="card" onclick="go('comp','${c.id}',0,'gloss')"><b>📘 ${k}</b><p>${v}</p></div>`)});(c.faqs||FAQS).forEach(f=>{if((f[0]+f[1]).toLowerCase().includes(q))r.push(`<div class="card" onclick="go('comp','${c.id}',0,'gloss')"><b>❓ ${f[0]}</b><p>${f[1]}</p></div>`)})});
return `<h2 style="color:var(--dk)">Results for "${view.q}" (${r.length})</h2><div class="grid">${r.join('')||'<p>No matches.</p>'}</div>`}

render();
</script></body></html>
